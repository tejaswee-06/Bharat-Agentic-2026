services:
  kavach-postgis:
    image: postgis/postgis:16-3.4
    container_name: kavach-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: kavach
      POSTGRES_PASSWORD: kavach
      POSTGRES_DB: kavach_gis
    ports:
      - "5432:5432"
    volumes:
      - kavach_gis_data:/var/lib/postgresql/data
      - ./gis/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  kavach_gis_data:
